<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Düğün Konvoyu 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1430;font-family:"Segoe UI",Arial,sans-serif}
  #wrap{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;margin:0 auto;overflow:hidden}
  #wrap canvas{display:block;width:100%!important;height:100%!important}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lbl{display:flex;align-items:center;gap:.5em;padding:.35em .8em .35em .35em;border-radius:1.2em;background:rgba(0,0,0,.72);
       color:#fff;font-size:.95vh;white-space:nowrap;transform:translateY(-1.5em);box-shadow:0 .2em .6em rgba(0,0,0,.35)}
  .lbl.top{background:rgba(255,193,7,.95);color:#3a2600}
  .lbl img,.lbl .av{width:3em;height:3em;border-radius:50%;object-fit:cover;background:#888;display:grid;place-items:center;font-weight:800;font-size:1em;border:.18em solid #fff;flex:none}
  .lbl b{display:block;font-size:1.15em;max-width:9em;overflow:hidden;text-overflow:ellipsis}
  .lbl small{display:block;font-size:.85em;opacity:.9}
  .lbl.top small{opacity:1}
  .bride{background:rgba(233,30,99,.92);font-weight:800;font-size:1.5vh;padding:.4em 1em}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
  #title{text-align:center;margin-top:1.6vh;padding:.5vh 2vh;border-radius:2vh;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:2vh}
  #likejoin{margin-top:.7vh;padding:.4vh 1.6vh;border-radius:2vh;background:linear-gradient(90deg,#e91e63,#ff5c8a);color:#fff;font-weight:800;font-size:1.6vh;box-shadow:0 .3vh 1vh rgba(233,30,99,.5);animation:beat 1.4s ease-in-out infinite}
  #likejoin:empty{display:none}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #cam{margin-top:.6vh;color:#fff;font-size:1.1vh;opacity:.75;text-shadow:0 1px 3px #000}
  #pops{margin-top:1vh;display:flex;flex-direction:column;align-items:center;gap:.6vh}
  .pop{padding:.45vh 1.6vh;border-radius:2vh;background:rgba(0,0,0,.75);font-weight:800;font-size:1.7vh;animation:pop 2.6s forwards}
  @keyframes pop{0%{transform:scale(.4);opacity:0}10%{transform:scale(1.08);opacity:1}18%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  #gifts{position:absolute;left:1.5vh;top:24vh;display:flex;flex-direction:column;gap:.7vh;align-items:flex-start;max-width:60%}
  .gf{display:flex;align-items:center;gap:.8vh;padding:.5vh 1.4vh .5vh .5vh;border-radius:3vh;background:linear-gradient(90deg,rgba(255,64,129,.92),rgba(124,77,255,.85));color:#fff;font-weight:700;font-size:1.45vh;box-shadow:0 .3vh 1vh rgba(0,0,0,.4);animation:gfin .35s ease-out;transition:opacity .6s,transform .6s}
  .gf.out{opacity:0;transform:translateX(-120%)}
  .gf img,.gf .av{width:3.4vh;height:3.4vh;border-radius:50%;object-fit:cover;border:.2vh solid #fff;flex:none;display:grid;place-items:center;font-weight:800}
  .gf b{color:#ffeb3b}
  .gf .x{font-size:2.2vh;font-weight:900;color:#ffeb3b;margin-left:.3vh}
  .gf.bump{animation:gfbump .3s}
  @keyframes gfin{from{opacity:0;transform:translateX(-120%)}to{opacity:1;transform:none}}
  @keyframes gfbump{50%{transform:scale(1.12)}}
  #more{position:absolute;bottom:2vh;padding:.6vh 2vh;border-radius:2vh;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:1.35vh;display:none;max-width:92%;text-align:center;line-height:1.4}
  #empty{position:absolute;top:42%;padding:1.5vh 3vh;border-radius:2vh;background:rgba(0,0,0,.6);color:#fff;text-align:center;font-weight:800;font-size:2vh}
  #empty small{display:block;font-weight:600;font-size:1.4vh;margin-top:.5vh}
  #sound{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:1.5vh 3vh;border:0;border-radius:2vh;background:#ffd54f;font-weight:800;font-size:2vh;cursor:pointer;display:none;pointer-events:auto;z-index:9}
  #panel{position:fixed;left:8px;bottom:8px;display:none;gap:6px;flex-wrap:wrap;max-width:420px;z-index:10}
  #panel button{font:600 14px "Segoe UI",Arial;padding:8px 10px;border:0;border-radius:8px;background:#fff;color:#222;cursor:pointer}
  #panel button:hover{background:#ffd54f}
  #status{position:fixed;right:8px;bottom:8px;color:#fff;font:12px Arial;opacity:.7;text-shadow:0 1px 2px #000}
  #top10{position:absolute;right:1vh;top:12.5vh;min-width:20%;max-width:40%;padding:.7vh .9vh;border-radius:1.2vh;background:rgba(0,0,0,.66);color:#fff;font-size:1.2vh;line-height:1.45;box-shadow:0 .3vh 1vh rgba(0,0,0,.4)}
  #top10:empty{display:none}
  #top10 h4{margin:0 0 .3vh;font-size:1.3vh;color:#ffd54f;text-align:center;letter-spacing:.05em}
  #top10 .r{display:flex;align-items:center;gap:.5vh;white-space:nowrap}
  #top10 .r b{min-width:2.4vh;text-align:right;color:#ffd54f}
  #top10 .r span{overflow:hidden;text-overflow:ellipsis;max-width:15vh}
  #top10 .r.gelin{color:#ff80ab;font-weight:800}
  #top10 .r.ilk span{color:#ffe082;font-weight:800}
  .bubble{max-width:20vh;padding:.5vh 1vh;border-radius:1.2vh;background:#fff;color:#222;font-size:1.25vh;font-weight:600;box-shadow:0 .3vh .8vh rgba(0,0,0,.35);white-space:normal;word-break:break-word;position:relative;transition:opacity .5s;animation:gfbump .35s}
  .bubble:after{content:'';position:absolute;left:50%;bottom:-.75vh;margin-left:-.6vh;border:.6vh solid transparent;border-top-color:#fff;border-bottom:0}
  .bubble b{color:#e91e63;margin-right:.4vh}
  .lbl.bride img{width:3.2em;height:3.2em}
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:5}
  #np{position:absolute;left:1vh;bottom:.6vh;color:#fff;font-size:1vh;opacity:.75;text-shadow:0 1px 3px #000}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:2vh;background:#203040}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>

<body>
<div id="wrap">
  <div id="labels"></div>
  <div id="hud">
    <div id="title">🚗 DÜĞÜN KONVOYU<br><span style="font-size:.78em">🌹 Gül = MAKAS · 🍩 Donut = GELİN ARABASI</span></div>
    <div id="likejoin"></div>
    <div id="cam"></div>
    <div id="pops"></div>
    <div id="empty">Hediye at, konvoya katıl! 🎁<small>ya da 100 beğeni at ·Çok atan en güzel arabaya biner</small></div>
    <div id="more"></div>
    <div id="gifts"></div>
    <div id="top10"></div>
    <div id="np"></div>
  </div>
  <div id="fade"></div>
  <button id="sound">🔊 Sesi açmak için tıkla</button>
  <div id="loading">Arabalar yükleniyor…</div>
</div>
<div id="panel">
  <button data-g="rose">🌹 Gül (1)</button>
  <button data-g="small">🎁 Küçük (10)</button>
  <button data-g="mid">🎁 Orta (100)</button>
  <button data-g="big">💎 Büyük (1000)</button>
  <button data-g="donut">🍩 Donut (30)</button>
  <button data-g="new">➕ Yeni kişi</button>
  <button data-g="like">❤️ Beğeni</button>
  <button data-g="cam">🎥 Kamera</button>
  <button data-g="chat">💬 Yorum</button>
  <button data-g="member">👋 Gelen</button>
  <button data-g="hava">🌦️ Hava</button>
  <button data-g="muzik">🎵 Şarkı</button>
  <button data-g="reset">🔄 Sıfırla</button>
</div>
<div id="status"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =================== AYARLAR ===================
const AYAR = {
  damatGelin: 'GELİN & DAMAT',
  gorunenAraba: 14,          // 3D sahnede görünen konvoy arabası (2'li sırada 7 sıra)
  ikiliSira: true,          // konvoy yan yana 2'li sıra halinde gitsin
  anons: true,              // sesli anons (hoş geldin, teşekkür, makas tepkisi)
  muzik: false,             // (kapatildi) telifsiz müzik çalsın (muzik klasörü boşsa oyunun kendi bestesi)
  muzikSes: 0.32,           // müzik ses seviyesi (0-1)
  havaDegisim: true,        // hava / harita değişsin
  havaSuresi: 150,          // her hava kaç saniye sürsün
  havaSirasi: ['gece', 'yagmur', 'gunduz', 'kar', 'gunbatimi'],
  kameraSuresi: 9,          // her kamera açısı kaç saniye kalsın
  hiz: 16,                  // konvoyun hızı (yol kayma hızı)
  gece: true,               // true = gece sahil yolu, false = gündüz
  begeniKatilim: 100,     // bu kadar beğeni atan konvoya katılır (0 = kapalı)
  ses: true,
  siniflar: [
    { min: 0,    ad: 'Emektar',      tip: 'emektar' },
    { min: 10,   ad: 'Aile Arabası', tip: 'sedan'   },
    { min: 50,   ad: 'Jip',          tip: 'jip'     },
    { min: 100,  ad: 'Spor Araba',   tip: 'spor'    },
    { min: 500,  ad: 'Limuzin',      tip: 'limuzin' },
    { min: 1000, ad: 'Altın Süper',  tip: 'altin'   },
  ],
};
// ===============================================

if (new URLSearchParams(location.search).has('sessiz')) { AYAR.ses = false; AYAR.muzik = false; AYAR.anons = false; }
if (AYAR.begeniKatilim > 0) document.getElementById('likejoin').textContent = `❤️ ${AYAR.begeniKatilim} BEĞENİ AT, KONVOYA KATIL! 🚗`;
const params = new URLSearchParams(location.search);
if (params.has('test') || params.has('demo')) document.getElementById('panel').style.display = 'flex';
const wrap = document.getElementById('wrap');

// ---------- SAHNE ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio, 1.5), 2)); // net görüntü için
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
wrap.prepend(renderer.domElement);
const labelR = new CSS2DRenderer({ element: document.getElementById('labels') });

const GECE = AYAR.gece;
const scene = new THREE.Scene();
const UFUK = GECE ? 0x1a2350 : 0xbfdcf2;
scene.background = new THREE.Color(UFUK);
scene.fog = new THREE.Fog(UFUK, GECE ? 90 : 100, GECE ? 360 : 380);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = GECE ? 0.45 : 1;

const camera = new THREE.PerspectiveCamera(50, 9/16, 0.5, 900);
const hemi = new THREE.HemisphereLight(GECE ? 0x7d8fd0 : 0xdfefff, GECE ? 0x202030 : 0x4a7a3a, GECE ? 0.85 : 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(GECE ? 0xb8ccff : 0xfff2dd, GECE ? 1.3 : 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 50, bottom: -50, near: 1, far: 160 });
scene.add(sun, sun.target);

function resize(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false); labelR.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- YOL VE ÇEVRE: SAHİL YOLU ----------
// solda: gezinti yolu, kumsal, palmiyeler, deniz   ·   sağda: kaldırım, ışıkları yanan binalar
const LANE = 3.6, GAP = 8.5, SPAN = 300, Z0 = -110;
const EDGE = LANE*1.5 + 0.6;
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const addGlow = (color, opacity) => new THREE.MeshBasicMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
function slab(w, h, d, color, x, y, z, opts = {}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.9, ...opts }));
  m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
}
const cityGround = slab(400, 0.1, 900, GECE ? 0x1b1e26 : 0x707a6a, EDGE + 200, -0.06, 0);           // şehir tarafı zemin
const road = slab(EDGE*2, 0.1, 900, 0x2b2e35, 0, -0.04, 0, { roughness: 0.7 }); // asfalt
const sidewalk = slab(4.2, 0.26, 900, 0x9c968c, EDGE + 2.1, 0.13, 0);                             // sağ kaldırım
const promenade = slab(3.6, 0.26, 900, 0xc2b49a, -EDGE - 1.8, 0.13, 0);                            // sahil gezinti yolu
const sand = slab(22, 0.1, 900, 0xdcc48e, -EDGE - 3.6 - 11, -0.04, 0, { roughness: 1 });      // kumsal
const wetSand = slab(5, 0.1, 900, 0xa08a5c, -EDGE - 3.6 - 22 - 2.5, -0.09, 0, { roughness: 0.5 }); // ıslak kum
const SHORE = -EDGE - 3.6 - 27;

// deniz: kendi ürettiğim dalga dokusu, konvoy ilerledikçe kayar
const waveTex = (() => { const N = 256, c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d'), img = x.createImageData(N, N);
  const W = [[3, 1, 0.9, 0], [1, 4, 0.7, 1.3], [5, -2, 0.45, 2.1], [-3, 6, 0.35, 0.4], [9, 3, 0.2, 3.3]];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    let dx = 0, dy = 0; for (const [a, b, amp, ph] of W) { const k = 2*Math.PI/N, s = Math.cos(k*(a*i + b*j) + ph)*amp; dx += s*a*k; dy += s*b*k; }
    const nx = -dx*14, ny = -dy*14, nz = 1, l = Math.hypot(nx, ny, nz), p = (j*N + i)*4;
    img.data[p] = (nx/l*0.5 + 0.5)*255; img.data[p+1] = (ny/l*0.5 + 0.5)*255; img.data[p+2] = (nz/l*0.5 + 0.5)*255; img.data[p+3] = 255;
  }
  x.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; })();
const sea = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: GECE ? 0x0b2747 : 0x1c7cb5, roughness: 0.08, metalness: 0.35, normalMap: waveTex, normalScale: new THREE.Vector2(0.45, 0.45) }));
sea.rotation.x = -Math.PI/2; sea.position.set(SHORE - 500, -0.18, 0); scene.add(sea);
const foam = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 900), addGlow(0xffffff, 0.35)); foam.rotation.x = -Math.PI/2; foam.position.set(SHORE + 0.2, -0.02, 0); scene.add(foam);

// kayan objeler
const movers = [];
const wrapZ = it => { if (it.z > Z0 + SPAN) it.z -= SPAN; };
function scrolling(mesh, count, place){
  const dummy = new THREE.Object3D(), items = [];
  for (let i = 0; i < count; i++) items.push(place(i));
  mesh.count = count; scene.add(mesh);
  movers.push(dt => {
    items.forEach((it, i) => {
      it.z += AYAR.hiz * dt; wrapZ(it);
      dummy.position.set(it.x, it.y || 0, it.z); dummy.rotation.set(0, it.r || 0, 0); dummy.scale.setScalar(it.s || 1);
      dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
  });
}
function scrollingObjects(objs){ objs.forEach(o => scene.add(o)); movers.push(dt => objs.forEach(o => { o.position.z += AYAR.hiz * dt; if (o.position.z > Z0 + SPAN) o.position.z -= SPAN; })); }
movers.push(dt => { waveTex.offset.y += AYAR.hiz * dt / (1000/30); waveTex.offset.x += dt*0.01; foam.material.opacity = 0.25 + Math.sin(performance.now()/700)*0.12; });

// şerit çizgileri
const DASH = 60;
if (AYAR.ikiliSira) {
  scrolling(new THREE.InstancedMesh(new THREE.BoxGeometry(0.2, 0.02, 2.8), new THREE.MeshBasicMaterial({ color: 0xcfd3da }), DASH), DASH, i => ({ x: 0, y: 0.02, z: Z0 + i * (SPAN/DASH) }));
  for (const sx of [-1, 1]) slab(0.16, 0.02, 900, 0xd8d8d8, sx*(EDGE - 0.45), 0.02, 0, { roughness: 0.6 }); // kenar çizgileri
} else
scrolling(new THREE.InstancedMesh(new THREE.BoxGeometry(0.18, 0.02, 2.6), new THREE.MeshBasicMaterial({ color: GECE ? 0xcfd3da : 0xf2f2f2 }), DASH*2),
  DASH*2, i => ({ x: (i % 2 ? 1 : -1) * LANE/2, y: 0.02, z: Z0 + Math.floor(i/2) * (SPAN/DASH) }));
// sahil korkuluğu
for (const y of [0.75, 1.15]) slab(0.08, 0.08, 900, 0xe8e8e8, -EDGE - 3.5, y, 0, { metalness: 0.6, roughness: 0.3 });
const POSTS = 120;
scrolling(new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 1.2, 0.1).translate(0, 0.6, 0), new THREE.MeshStandardMaterial({ color: 0xe8e8e8, metalness: 0.6, roughness: 0.3 }), POSTS),
  POSTS, i => ({ x: -EDGE - 3.5, y: 0.2, z: Z0 + i*(SPAN/POSTS) }));

// palmiyeler
const palm = (() => {
  const trunk = [], leaves = []; let px = 0, py = 0;
  for (let i = 0; i < 7; i++) { const g = new THREE.CylinderGeometry(0.2 - i*0.012, 0.25 - i*0.012, 1.15, 7); g.translate(px, py + 0.57, 0); trunk.push(g); py += 1.1; px += 0.06*i; }
  for (let k = 0; k < 9; k++) { const g = new THREE.BoxGeometry(0.55, 0.05, 3.4); g.translate(0, 0, 1.7); g.rotateX(0.35 + (k % 3)*0.15); g.rotateY(k/9*Math.PI*2); g.translate(px, py, 0); leaves.push(g); }
  return { trunk: mergeGeometries(trunk), leaves: mergeGeometries(leaves) };
})();
const PALMS = 40;
const palmSpots = Array.from({ length: PALMS }, (_, i) => ({ x: -EDGE - 5.5 - Math.random()*17, z: Z0 + (i + Math.random()*0.6)*(SPAN/PALMS), s: 0.9 + Math.random()*0.45, r: Math.random()*6.28 }));
const palmT = new THREE.InstancedMesh(palm.trunk, new THREE.MeshStandardMaterial({ color: 0x8b6a45, roughness: 1 }), PALMS);
const palmL = new THREE.InstancedMesh(palm.leaves, new THREE.MeshStandardMaterial({ color: GECE ? 0x2f8a3e : 0x3aa84a, roughness: 0.8 }), PALMS);
palmT.castShadow = palmL.castShadow = true;
scrolling(palmT, PALMS, i => palmSpots[i]); scrolling(palmL, PALMS, i => palmSpots[i]);

// binalar: pencere ışıkları yanan, çatısında neon şeritli
const winTex = Array.from({ length: 4 }, (_, v) => { const c = document.createElement('canvas'); c.width = 128; c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#20242e'; x.fillRect(0, 0, 128, 256);
  const lit = ['#ffd27a', '#ffe7b0', '#fff4d8', '#9fd4ff', '#ffb36b'];
  for (let r = 0; r < 16; r++) for (let q = 0; q < 8; q++) { const on = Math.random() < 0.5; x.fillStyle = on ? lit[(Math.random()*lit.length) | 0] : (v % 2 ? '#2c3442' : '#323a4a'); x.fillRect(q*16 + 3, r*16 + 3, 10, 10); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; });
const NEON = [0xff2d95, 0x00e5ff, 0xffd400, 0x7c4dff, 0x00ff9c];
const bMats = [], neonMats = [];
function building(x, z, w, h, d){
  const g = new THREE.Group();
  const tex = winTex[(Math.random()*4) | 0].clone(); tex.repeat.set(Math.max(1, Math.round(w/10)), Math.max(1, Math.round(h/16))); tex.needsUpdate = true;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d).translate(0, h/2, 0), new THREE.MeshStandardMaterial({ color: GECE ? 0xffffff : 0xd8d2c8, map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: GECE ? 1.1 : 0, roughness: 0.85 }));
  m.castShadow = true; g.add(m); bMats.push(m.material);
  if (Math.random() < 0.6) { const col = NEON[(Math.random()*NEON.length) | 0];
    const n = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.4, d*0.95), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: GECE ? 3 : 0.4 }));
    n.position.set(-w/2 - 0.05, h - 0.6, 0); g.add(n); neonMats.push(n.material); }
  g.position.set(x, 0, z); return g;

    rev(){ const a = ensure(); if (!a) return; const t = a.currentTime;

      engine.f.frequency.setTargetAtTime(1400, t, 0.1); engine.f.frequency.setTargetAtTime(380, t+0.9, 0.5);

const Anons = (() => {
  const q = []; let konusuyor = false, ses = null, guvenlik = null, sonKonusma = 0, uzakSon = 0, bekleyenId = null;
  function bitti(){ if (!konusuyor) return; konusuyor = false; bekleyenId = null; clearTimeout(guvenlik); sonKonusma = Date.now(); Muzik.duck(false); setTimeout(sonraki, 300); }
  const sec = () => { const vs = speechSynthesis.getVoices(); ses = vs.find(v => /^tr/i.test(v.lang)) || null; };
  try { sec(); speechSynthesis.onvoiceschanged = sec; } catch {}
  function sonraki(){
    if (konusuyor || !q.length || !window.speechSynthesis) return;
    const it = q.shift(); konusuyor = true; Muzik.duck(true);
    // kız sesi: Edge'deki anons penceresi (Emel) açıksa ona okut
    if (Date.now() - uzakSon < 20000 && window.__ws && window.__ws.readyState === 1) {
      bekleyenId = Math.random().toString(36).slice(2); window.__ws.send(JSON.stringify({ type: 'anons', id: bekleyenId, text: it.text }));
      guvenlik = setTimeout(bitti, 15000); return;
    }
    const u = new SpeechSynthesisUtterance(it.text); u.lang = 'tr-TR'; if (ses) u.voice = ses; u.rate = 1.08; u.pitch = 1.05; u.volume = 1;
    u.onend = bitti; u.onerror = bitti; guvenlik = setTimeout(() => { try { speechSynthesis.cancel(); } catch {} bitti(); }, 12000);
    speechSynthesis.speak(u);
  }
  return {
    say(text, oncelik = 1){
      (window.__anonsLog = window.__anonsLog || []).push(text); if (window.__anonsLog.length > 50) window.__anonsLog.shift();
      if (!AYAR.anons || !text) return;
      if (q.length >= 5) { let k = 0; for (let i = 1; i < q.length; i++) if (q[i].p < q[k].p) k = i; if (q[k].p > oncelik) return; q.splice(k, 1); }
      q.push({ text, p: oncelik }); q.sort((a, b) => b.p - a.p); sonraki();
    },
    bos(){ return !konusuyor && !q.length && Date.now() - sonKonusma > 25000; },
    uzak(){ uzakSon = Date.now(); },
    uzakBitti(id){ if (id && id === bekleyenId) bitti(); },
  };
})();

let template = null, CAR = { L: 4.6, W: 2, H: 1.4 };
async function loadModel(){
  const gltf = await new GLTFLoader().loadAsync('/models/arabalar.glb');
  const model = gltf.scene; model.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
  model.scale.multiplyScalar(4.6 / Math.max(size.x, size.z));
  const rot = new THREE.Group(); rot.add(model);
  const root = new THREE.Group(); root.add(rot); root.updateMatrixWorld(true);
  // ön tarafı bul ve -Z yönüne çevir
  box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  let front = null; root.traverse(o => { if (!front && /front.?light/i.test(o.name)) front = o; });
  if (front) {
    const fp = new THREE.Box3().setFromObject(front).getCenter(new THREE.Vector3()).sub(c);
    rot.rotation.y = Math.PI - Math.atan2(fp.x, fp.z);
  }
  root.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(root); box.getCenter(c);
  rot.position.set(-c.x, -box.min.y, -c.z); root.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(root); size = box.getSize(new THREE.Vector3());
  CAR = { L: size.z, W: size.x, H: size.y };
  // tekerlekler için dönme noktası
  // sadece gerçek tekerlek düğümleri ("Front Left Wheel" vb.) - farların içindeki "Wheels" parçaları değil
  const wheels = []; root.traverse(o => { if (/(front|rear)[\s_]*(left|right)[\s_]*wheel$/i.test(o.name.trim())) wheels.push(o); });
  for (const w of wheels) {
    const pivot = new THREE.Group(); pivot.userData.wheel = true;
    pivot.position.copy(new THREE.Box3().setFromObject(w).getCenter(new THREE.Vector3()));
    root.add(pivot); root.updateMatrixWorld(true); pivot.attach(w);
  }
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  template = root;
}

function kotuMu(s){

  if (KOTU_UZUN.some(w => bitisik.includes(w.replace(/(.)\1+/g,'$1')) && !(w === 'gay' && /gayret|gayri|gaye/.test(bitisik)) && !(w === 'anal' && /analiz|kanal|anali|banal/.test(bitisik)))) return true;
  return kelimeler.some(k => KOTU_KISA.includes(k));
}
function temizIsim(s){
  if (!s) return s;
  if (!kotuMu(s)) return s;
  const ilk = [...String(s).replace(/[^\p{L}\p{N}]/gu,'')][0] || '?';
  return ilk + '***';
}
window.temizIsim = temizIsim;
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

// ---------- KAMERA ----------
const Cam = (() => {
  const modes = [
    { ad: 'YANDAN',     f: (c, t) => ({ p: [-22 + Math.sin(t*0.25)*3, 7, c.mid - 10], l: [0, 2, c.mid - 6] }) },
    { ad: 'TEPEDEN',    f: (c, t) => ({ p: [0.01, 46 + c.len*0.4, c.mid + 2], l: [0, 0, c.mid - 6] }), top: true },
    { ad: 'ARKADAN',    f: (c, t) => ({ p: [2.5, 3.2, c.last + 10], l: [0, 1.2, c.first - 8] }) },
    { ad: 'ÖNDEN',      f: (c, t) => ({ p: [-3, 2.6, -12], l: [0, 1, Math.min(c.mid, 22)] }) },
    { ad: 'DRONE',      f: (c, t) => { const a = t*0.18; return { p: [-8 + Math.cos(a)*15, 16, c.mid + Math.sin(a)*26], l: [0, 0, c.mid] }; } },
    { ad: 'ÇAPRAZ TEPE', f: (c, t) => ({ p: [-12, 22, c.first - 14], l: [0, 0, c.mid + 4] }) },
  ];
  let idx = 0, timer = 0, focusCar = null, focusT = 0, lastFocus = -99;
  const pos = new THREE.Vector3(16, 5, 10), look = new THREE.Vector3(0, 1, 10);
  const tp = new THREE.Vector3(), tl = new THREE.Vector3();
  const camEl = document.getElementById('cam');
  return {
    next(){ idx = (idx + 1) % modes.length; timer = 0; focusCar = null; },
    focus(car){ const now = performance.now()/1000; if (now - lastFocus < 5) return; lastFocus = now; focusCar = car; focusT = 3.2; },
    update(dt, t){
      const n = sirSayisi(Math.min(cars.length, AYAR.gorunenAraba));
      const c = { first: 0, last: n*GAP, mid: n*GAP/2, len: n*GAP };
      let label;
      if (focusCar && focusT > 0 && focusCar.obj) {
        focusT -= dt; const o = focusCar.obj.position;
        tp.set(o.x + 6.5*(-focusCar.side || 1), 2.6, o.z - 7); tl.set(o.x, 0.9, o.z); label = '🎥 MAKAS KAMERASI';
      } else {
        focusCar = null; timer += dt;
        if (timer > AYAR.kameraSuresi) this.next();
        const m = modes[idx].f(c, t); tp.fromArray(m.p); tl.fromArray(m.l); label = '🎥 ' + modes[idx].ad;
      }
      this.top = !focusCar && !!modes[idx].top;
      const k = 1 - Math.exp(-dt * (focusCar ? 3.5 : 1.6));
      pos.lerp(tp, k); look.lerp(tl, k);
      camera.position.copy(pos); camera.lookAt(look);
      if (camEl.textContent !== label) camEl.textContent = label;
      sun.position.set(look.x - 30, 38, look.z - 32); sun.target.position.copy(look);
    },
    look,
  };
})();

// ---------- DÖNGÜ ----------
const moreEl = document.getElementById('more'), emptyEl = document.getElementById('empty');
const clock = new THREE.Clock();
function syncObjects(){
  cars.forEach((car, i) => {
    const visible = i < AYAR.gorunenAraba;
    if (visible && !car.obj) {
      car.obj = makeCarObject(); car.obj.position.set(car.x, 0, car.z);
      const div = document.createElement('div'); car.label = new CSS2DObject(div); car.label.position.set(0, CAR.H + 0.9, 0); car.obj.add(car.label);
      car.tip = null;
    }
    if (car.obj) {
      const tip = tierOf(car.coins).tip;
      if (tip !== car.tip) { car.tip = tip; styleCar(car.obj, tip, car); }
      if (car.rank !== i) { car.rank = i; updateLabel(car); }
      car.label.element.style.display = visible ? '' : 'none';
      if (!visible && car.z > sirSayisi(AYAR.gorunenAraba)*GAP + 30) dropObj(car);
    }
  });
}
function update(dt, t){
  qTimer -= dt; if (qTimer <= 0 && queue.length) { queue.shift()(); qTimer = 0.5; }
  syncObjects();
  movers.forEach(m => m(dt));
  const spin = AYAR.hiz * dt / 0.36;
  cars.forEach((car, i) => {
    const visible = i < AYAR.gorunenAraba;
    const p = yer(i), tz = visible ? p.z + (car.tip === 'limuzin' ? 1.2 : 0) : sirSayisi(AYAR.gorunenAraba)*GAP + 60;
    let tx = visible ? p.x : 0, zk = 2.2;
    if (car.swerve) {
      const s = car.swerve; s.t += dt / s.dur; const pr = Math.min(1, s.t);
      const off = pr < 0.7 ? Math.sin(pr/0.7*Math.PI/2) : Math.cos((pr-0.7)/0.3*Math.PI/2) - Math.sin((pr-0.7)/0.3*Math.PI)*0.28;
      if (AYAR.ikiliSira) { const yon = tx >= 0 ? -1 : 1; tx = tx + yon * SIRA_X * 2 * off; } else tx = car.side * LANE * off; zk = pr < 0.15 ? 0.6 : 2.4;
      if (pr > 0.68 && pr < 0.97 && car.obj) for (let k = 0; k < 2; k++) puff(car.x, car.z + CAR.L*0.45);
      if (pr >= 1) car.swerve = null;
    }
    const px = car.x;
    car.x += (tx - car.x) * Math.min(1, dt * 8);
    car.z += (tz - car.z) * Math.min(1, dt * zk);
    const vx = (car.x - px) / Math.max(dt, 1e-3);
    car.yaw += (-vx * 0.09 - car.yaw) * Math.min(1, dt * 10);
    if (car.obj) {
      const o = car.obj; o.position.set(car.x, 0, car.z); o.rotation.y = car.yaw;
      if (Cam.top) { const sol = AYAR.ikiliSira && p.x < 0; car.label.position.set((sol ? -1 : 1)*(CAR.W*0.5 + 0.4), 0.5, 0); car.label.center.set(sol ? 1.02 : -0.02, 0.5); }
      else { car.label.position.set(0, CAR.H + 0.9, 0); car.label.center.set(0.5, 0.5); }
      o.userData.wheels.forEach(w => w.rotation.x -= spin);
      if (car.tip === 'emektar') { o.position.y = Math.abs(Math.sin(t*9 + i)) * 0.05; o.rotation.z = Math.sin(t*5 + i) * 0.02; }
      if (o.userData.glow) o.userData.glow.material.color.setHSL((t*0.4) % 1, 1, 0.5);
      animateTails(o, t + i);
      for (const e of o.userData.extras.children) {
        if (e.userData.flag) e.rotation.y = Math.PI/2 + Math.sin(t*8 + i)*0.25;
        if (e.userData.blink) e.material.emissiveIntensity = (Math.sin(t*12) > 0) === (e.userData.blink > 0) ? 2.5 : 0.1;
      }
      if (car.flash > 0) { car.flash -= dt; o.userData.body.forEach(m => { m.emissive.setRGB(0.3*car.flash, 0.5*car.flash, 0.7*car.flash); }); if (car.flash <= 0) o.userData.body.forEach(m => m.emissive.setRGB(0,0,0)); }
    }
  });
  if (bride) {
    bride.position.x = Math.sin(t*0.9) * 0.15; bride.rotation.y = Math.sin(t*0.9) * -0.01;
    bride.userData.wheels.forEach(w => w.rotation.x -= spin);
    const bl = bride.userData.label;
    if (Cam.top) { bl.position.set(CAR.W*0.5 + 0.4, 0.5, 0); bl.center.set(-0.02, 0.5); } else { bl.position.set(0, CAR.H + 1.1, 0); bl.center.set(0.5, 0.5); }
    animateTails(bride, t);
    if (bride.userData.flash > 0) { bride.userData.flash -= dt; const f = Math.max(0, bride.userData.flash); bride.userData.body.forEach(m => m.emissive.setRGB(0.5*f, 0.2*f, 0.35*f)); }
  }
  top10T -= dt; if (top10T <= 0) { top10T = 0.3; renderTop10(); }
  havaGuncelle(dt, t);
  for (const s of smokes) if (s.userData.life > 0) { s.userData.life -= dt*1.2; s.position.z += AYAR.hiz*dt*0.6; s.position.y += dt*0.6; s.scale.setScalar(0.6 + (1 - s.userData.life)*2.4); s.material.opacity = s.userData.life*0.7; if (s.userData.life <= 0) s.visible = false; }
  updateFireworks(dt);
  for (let i = hearts.length - 1; i >= 0; i--) { const h = hearts[i]; h.life -= dt*0.5; h.o.position.y += h.vy*dt; h.o.element.style.opacity = h.life; if (h.life <= 0) { h.o.removeFromParent(); h.o.element.remove(); hearts.splice(i, 1); } }
  const hidden = cars.length - AYAR.gorunenAraba;
  moreEl.style.display = hidden > 0 ? 'block' : 'none'; if (hidden > 0) moreEl.textContent = `Sırada: ` + cars.slice(AYAR.gorunenAraba, AYAR.gorunenAraba + 4).map((c, k) => `${AYAR.gorunenAraba + k + 1}. ${c.nick}`).join(" · ") + (hidden > 4 ? ` · +${hidden - 4}` : "") + " — 🌹 Gül = makas · 🍩 Donut = gelin arabası";
  emptyEl.style.display = cars.length ? 'none' : 'block';
  Cam.update(dt, t);
}
function frame(){
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  update(dt, t); updateSky(); renderer.render(scene, camera); labelR.render(scene, camera);
}
window.__step = (n = 1, dt = 0.033) => { for (let i = 0; i < n; i++) update(dt, clock.elapsedTime += dt); updateSky(); renderer.render(scene, camera); labelR.render(scene, camera); };

// ---------- BAĞLANTI ----------
const st = document.getElementById('status');
function connect(){
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { st.textContent = '● bağlı'; window.__ws = ws; };
  ws.onclose = () => { st.textContent = '○ bağlantı yok, tekrar deneniyor…'; setTimeout(connect, 2000); };
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.type === 'hello') { if (window.__boot && window.__boot !== m.boot) { window.__saveState(); location.reload(); } window.__boot = m.boot; }
    else if (['gift', 'like', 'chat', 'member'].includes(m.type) && (m.nick = temizIsim(m.nick || m.user), false)) {}
    else if (m.type === 'ses-hazir') Anons.uzak(); else if (m.type === 'anons-bitti') Anons.uzakBitti(m.id);
    else if (m.type === 'chat') onChat(m); else if (m.type === 'member') onMember(m);
    else if (m.type === 'reset') { tests.reset(); gelin = null; brideLabel(); likesBy.clear(); joinCount = 0; try { localStorage.removeItem('konvoy-durum'); } catch {} addPopup('🔄 Konvoy sıfırlandı! Yeni konvoy başlıyor 🚗', '#7cf'); }
    else if (m.type === 'gift') onGift(m); else if (m.type === 'like') onLike(m); else if (m.type === 'info') st.textContent = '● ' + m.text; };
}

// ---------- TEST ----------
const fakeNames = ['ayse_k','mehmet34','zeyno','kral_ali','elif.nur','burak_x','dilara','emre06','selin_s','hasan.usta','gizem','oguzhan'];
let fakeIdx = 0;
function fakeUser(fresh){
  if (!fresh && cars.length && Math.random() < 0.75) { const c = cars[Math.floor(Math.random()*cars.length)]; return { user: c.id, nick: c.nick }; }
  const n = fakeNames[fakeIdx++ % fakeNames.length] + (fakeIdx > fakeNames.length ? fakeIdx : ''); return { user: n, nick: n, pic: fakeAvatar(fakeIdx) };
}
// test için sahte profil resmi (gerçek yayında TikTok profil fotoğrafı gelir)
function fakeAvatar(i){
  const c = document.createElement('canvas'); c.width = c.height = 96; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 96, 96); g.addColorStop(0, `hsl(${i*67 % 360} 90% 60%)`); g.addColorStop(1, `hsl(${(i*67 + 60) % 360} 90% 45%)`);
  x.fillStyle = g; x.fillRect(0, 0, 96, 96); x.font = '56px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(['😎','🤠','😍','🥳','😜','🤩','😇','🧔','👩','👨','👱‍♀️','🧕'][i % 12], 48, 54);
  return c.toDataURL();
}
const tests = {
  rose:  () => onGift({ ...fakeUser(), coins: 1, count: 1, isRose: true }),
  small: () => onGift({ ...fakeUser(), coins: 10, count: 1 }),
  mid:   () => onGift({ ...fakeUser(), coins: 100, count: 1 }),
  big:   () => onGift({ ...fakeUser(), coins: 1000, count: 1 }),
  donut: () => onGift({ ...fakeUser(), coins: 30, count: 1, isDonut: true }),
  new:   () => onGift({ ...fakeUser(true), coins: 1, count: 1, isRose: true }),
  like:  () => onLike({ ...fakeUser(true), count: AYAR.begeniKatilim || 5 }),
  cam:   () => Cam.next(),
  chat:  () => { const c = cars[Math.floor(Math.random()*cars.length)] || gelin; if (c) onChat({ user: c.id, text: sec1(['Selam konvoy! 🚗', 'Kornaya bas kornaya!', 'Gelin çok güzel 😍', 'Ben de öne geçicem 🌹']) }); },
  member:() => onMember({ ...fakeUser(true) }),
  hava:  () => havaDegistir(),
  muzik: () => Muzik.next(),
  reset: () => { try { localStorage.removeItem('konvoy-durum'); } catch {} cars.forEach(c => dropObj(c)); cars = []; byId.clear(); queue.length = 0; gelin = null; brideLabel(); },
};
window.tests = tests; window.__onLike = onLike; window.__gift = onGift;
window.__sira = () => (gelin ? ['💍 ' + gelin.nick] : []).concat(cars.map((c, i) => (i + 1) + '. ' + c.nick + (c.obj ? '' : ' (görünmüyor)')));
window.__anons = (t) => Anons.say(t, 3); window.__hava = (a) => havaUygula(a);
document.querySelectorAll('#panel button').forEach(b => b.onclick = () => tests[b.dataset.g]());

// ---------- BAŞLAT ----------
try {
  await loadModel();
} catch (e) {
  document.getElementById('loading').textContent = 'Model yüklenemedi: models/arabalar.glb bulunamadı'; throw e;
}
makeBride();
document.getElementById('loading').remove();
renderer.setAnimationLoop(frame);
// konvoyu kaydet / geri yükle (köprü yeniden başlasa da arabalar kaybolmasın)
const SAVE_KEY = 'konvoy-durum';
const kayit = c => ({ id: c.id, nick: c.nick, pic: c.pic && c.pic.startsWith('http') ? c.pic : '', coins: c.coins, variant: c.variant });
function saveState(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify({ t: Date.now(), joinCount, gelin: gelin ? kayit(gelin) : null, cars: cars.map(c => ({ id: c.id, nick: c.nick, pic: c.pic && c.pic.startsWith('http') ? c.pic : '', coins: c.coins, variant: c.variant, special: c.special || null })) })); } catch {} }
window.__saveState = saveState;
if (!params.has('demo') && !params.has('yeni')) try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (s && Date.now() - s.t < 3*3600*1000) {
    joinCount = s.joinCount || s.cars.length;
    s.cars.forEach((c, i) => { const car = { ...c, nick: temizIsim(c.nick || c.id), x: 0, z: (i + 1)*GAP, yaw: 0, hue: hashHue(c.id), swerve: null, obj: null, tip: null, side: 1 }; byId.set(c.id, car); cars.push(car); });
    const gi = cars.findIndex(c => c.special === 'gelin'); cars.forEach(c => c.special = null);
    if (s.gelin) { const g = { ...s.gelin, nick: temizIsim(s.gelin.nick || s.gelin.id), x: 0, z: 0, yaw: 0, hue: hashHue(s.gelin.id), obj: null, tip: null, side: 1, special: 'gelin' }; byId.set(g.id, g); gelin = g; }
    else if (gi >= 0) { gelin = cars.splice(gi, 1)[0]; gelin.special = 'gelin'; }
    cars.forEach((c, i) => { const p = yer(i); c.x = p.x; c.z = p.z; });
    brideLabel();
  }
} catch {}
setInterval(saveState, 3000);
havaIdx = Math.max(0, AYAR.havaSirasi.indexOf(params.get('hava') || 'gece'));
havaUygula(AYAR.havaSirasi[havaIdx] || 'gece');
if (AYAR.havaDegisim) setInterval(() => havaDegistir(), AYAR.havaSuresi*1000);
setTimeout(() => Muzik.start().catch(() => {}), 1200);
connect();
if (params.has('demo')) {
  for (let i = 0; i < 5; i++) tests.new();
  setInterval(() => { const r = Math.random(); (r < .55 ? tests.rose : r < .8 ? tests.small : r < .93 ? tests.mid : r < .97 ? tests.like : tests.big)(); }, 1800);
}
